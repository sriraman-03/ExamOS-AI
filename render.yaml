services:
  - type: web
    name: examos-backend
    env: python
    rootDir: examos/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./data/examos.db
      - key: ANTHROPIC_API_KEY
        value: ""
